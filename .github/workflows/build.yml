name: Build API 100 module

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify vendored API
        run: python3 tools/verify_project.py
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Check module metadata and API exclusion
        run: python3 tools/verify_project.py --apk app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BaiduCarSilent-API100
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
